<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up | Secure Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* Matches Login & MFA Pages */
        body {
            background: linear-gradient(135deg, #ece9ff, #f8f6ff);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
        }

        .auth-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 40px 35px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 15px 35px rgba(170, 150, 255, 0.15);
        }

        .auth-card h3 {
            font-weight: 600;
            color: #6a5acd;
            text-align: center;
        }

        .form-label {
            font-size: 0.9rem;
            color: #555;
        }

        .form-control {
            border-radius: 10px;
            padding: 10px 14px;
            border: 1px solid #ddd;
            transition: 0.3s;
        }

        .form-control:focus {
            border-color: #b39ddb;
            box-shadow: 0 0 6px rgba(179, 157, 219, 0.4);
        }

        .progress {
            height: 6px;
            border-radius: 10px;
            background: #eee;
            margin-top: 8px;
            overflow: hidden;
        }

        .req-tag {
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 20px;
            background: #f0f0f0;
            color: #888;
            margin: 2px;
            display: inline-block;
            transition: 0.3s;
            border: 1px solid #eee;
        }

        .req-tag.valid {
            background: #e8f5e9;
            color: #2e7d32;
            border-color: #c8e6c9;
        }

        .btn-primary {
            border-radius: 10px;
            padding: 12px;
            background-color: #b39ddb;
            border: none;
            font-weight: 500;
            transition: 0.3s;
        }

        .btn-primary:hover:not(:disabled) {
            background-color: #9575cd;
        }

        .btn-primary:disabled {
            background-color: #d1d1d1;
            cursor: not-allowed;
        }

        .login-link a {
            text-decoration: none;
            color: #7e57c2;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="auth-card">
    <h3 class="mb-4">Create Account</h3>

    <form action="{{ url_for('auth.signup') }}" method="POST">
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" placeholder="Choose a username" required>
        </div>
        
        <div class="mb-2">
            <label class="form-label">Password</label>
            <input type="password" name="password" id="pwdInput" class="form-control" placeholder="Create a strong password" required>
            
            <div class="progress">
                <div id="strengthBar" class="progress-bar" style="width: 0%; transition: 0.5s;"></div>
            </div>
        </div>

        <div class="mb-4">
            <span id="req-len" class="req-tag">8+ Chars</span>
            <span id="req-cap" class="req-tag">Uppercase</span>
            <span id="req-num" class="req-tag">Number</span>
            <span id="req-sym" class="req-tag">Symbol</span>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary w-100" disabled>
            Create Magic →
        </button>
    </form>
    
    <div class="text-center mt-3 login-link">
        <small>
            Already have an account? 
            <a href="{{ url_for('auth.login') }}">Login</a>
        </small>
    </div>
</div>

<script>
    const pwdInput = document.getElementById('pwdInput');
    const strengthBar = document.getElementById('strengthBar');
    const submitBtn = document.getElementById('submitBtn');
    
    const reqs = { 
        len: /.{8,}/, 
        cap: /[A-Z]/, 
        num: /[0-9]/, 
        sym: /[^A-Za-z0-9]/ 
    };

    pwdInput.addEventListener('input', () => {
        let score = 0;
        Object.keys(reqs).forEach(k => {
            const ok = reqs[k].test(pwdInput.value);
            const el = document.getElementById('req-'+k);
            if (el) el.classList.toggle('valid', ok);
            if(ok) score++;
        });

        const colors = ['#ef5350', '#ffa726', '#ffd54f', '#66bb6a'];
        strengthBar.style.width = (score * 25) + '%';
        strengthBar.style.backgroundColor = colors[score-1] || 'transparent';
        
        submitBtn.disabled = score < 4;
    });
</script>

</body>
</html>
