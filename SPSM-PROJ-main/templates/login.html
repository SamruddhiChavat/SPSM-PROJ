<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Secure Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #ece9ff, #f8f6ff);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .auth-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 40px 35px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 15px 35px rgba(170, 150, 255, 0.15);
        }

        .auth-card h3 {
            font-weight: 600;
            color: #6a5acd;
        }

        .form-label {
            font-size: 0.9rem;
            color: #555;
        }

        .form-control {
            border-radius: 10px;
            padding: 10px 14px;
            border: 1px solid #ddd;
            transition: 0.3s;
        }

        .form-control:focus {
            border-color: #b39ddb;
            box-shadow: 0 0 6px rgba(179, 157, 219, 0.4);
        }

        .btn-primary {
            border-radius: 10px;
            padding: 10px;
            background-color: #b39ddb;
            border: none;
            font-weight: 500;
            transition: 0.3s;
        }

        .btn-primary:hover {
            background-color: #9575cd;
        }

        .alert {
            border-radius: 8px;
            font-size: 0.85rem;
        }

        .signup-link a {
            text-decoration: none;
            color: #7e57c2;
            font-weight: 500;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="auth-card">
    <h3 class="text-center mb-4">Welcome Back</h3>

    <!-- Flash messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} p-2 small">
              {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <!-- Login Form -->
    <form action="{{ url_for('auth.login') }}" method="POST">
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" required>
        </div>
        
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-primary w-100">
            Login
        </button>
    </form>
    
    <!-- Signup Link (FIXED) -->
    <div class="text-center mt-3 signup-link">
        <small>
            New here?
            <a href="{{ url_for('auth.signup') }}">Sign Up</a>
        </small>
    </div>
</div>

</body>
</html>
