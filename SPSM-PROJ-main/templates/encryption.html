<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Encryption Center | Guard Portal</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: #f5f3ff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}
.container-box {
    width: 900px;
    background: white;
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.1);
}
</style>
</head>

<body>

<div class="container-box">

<h2 class="text-center mb-4">🔐 Encryption Center</h2>

<!-- FLASH -->
{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    {% for category, message in messages %}
      <div class="alert alert-{{ category }}">{{ message }}</div>
    {% endfor %}
  {% endif %}
{% endwith %}

<div class="row">

<!-- ENCRYPT -->
<div class="col-md-6">
    <h5>🔒 Encrypt File</h5>

    <form action="{{ url_for('encryption.encrypt_logic') }}" method="POST" enctype="multipart/form-data">
        <input type="file" name="file" class="form-control mb-3" required>

        <button class="btn btn-primary w-100"
                onclick="this.disabled=true; this.innerText='Encrypting...'">
            Encrypt File
        </button>
    </form>
</div>

<!-- DECRYPT -->
<div class="col-md-6">
    <h5>🔓 Decrypt File</h5>

    <form action="{{ url_for('encryption.decrypt_logic') }}" method="POST" enctype="multipart/form-data">
        <input type="file" name="file" class="form-control mb-3" required>

        <input type="text" name="key" placeholder="Enter key"
               class="form-control mb-3" required>

        <button class="btn btn-success w-100"
                onclick="this.disabled=true; this.innerText='Decrypting...'">
            Decrypt File
        </button>
    </form>
</div>

</div>

<!-- BACK -->
<div class="text-center mt-4">
    <a href="{{ url_for('dashboard') }}">← Back to Dashboard</a>
</div>

</div>

</body>
</html>
