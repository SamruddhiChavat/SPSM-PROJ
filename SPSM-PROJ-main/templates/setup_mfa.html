<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Setup MFA | Secure Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* Matches your Login Page exactly */
        body {
            background: linear-gradient(135deg, #ece9ff, #f8f6ff);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
        }

        .auth-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 40px 35px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 15px 35px rgba(170, 150, 255, 0.15);
            text-align: center;
        }

        .auth-card h3 {
            font-weight: 600;
            color: #6a5acd;
            margin-bottom: 1.5rem;
        }

        /* QR Code Styling */
        .qr-container {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            display: inline-block;
            border: 1px solid #eee;
            margin-bottom: 20px;
        }

        .qr-container img {
            width: 180px;
            height: 180px;
            display: block;
        }

        /* The Secret Key Box */
        .secret-box {
            background: #f3f0ff;
            padding: 12px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            color: #6a5acd;
            font-weight: 600;
            font-size: 1.1rem;
            letter-spacing: 1px;
            border: 1px dashed #b39ddb;
            margin-bottom: 25px;
        }

        .text-muted-small {
            font-size: 0.85rem;
            color: #777;
            margin-bottom: 8px;
        }

        /* Button - Matches Login Page */
        .btn-primary {
            border-radius: 10px;
            padding: 12px;
            background-color: #b39ddb;
            border: none;
            font-weight: 500;
            transition: 0.3s;
            color: white;
            text-decoration: none;
            display: block;
            width: 100%;
        }

        .btn-primary:hover {
            background-color: #9575cd;
            color: white;
        }
    </style>
</head>
<body>

<div class="auth-card">
    <h3>Two-Factor Auth</h3>
    
    <p class="text-muted-small">Scan this QR code with Google Authenticator or Authy:</p>
    
    <div class="qr-container">
        <img src="data:image/png;base64,{{ qr_image }}" alt="MFA QR Code">
    </div>

    <p class="text-muted-small">Can't scan? Enter this code manually:</p>
    <div class="secret-box">
        {{ secret }}
    </div>

    <a href="{{ url_for('login') }}" class="btn btn-primary">
        Finish Setup
    </a>
</div>

</body>
</html>
