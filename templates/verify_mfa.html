<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MFA Verification</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-image: url("{{ url_for('static', filename='background.jpg') }}");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            height: 100vh;
            display: flex;
            align-items: center;
        }

        .mfa-card {
            background: rgba(255, 255, 255, 0.85); /* The semi-transparent white */
            backdrop-filter: blur(10px); /* The blur effect */
            border-radius: 15px;
            padding: 30px;
            max-width: 400px;
            width: 100%;
            margin: auto;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            text-align: center;
        }

        .btn-mfa {
            background-color: #ffb7c5; /* Pink theme */
            border: none;
            color: #5d3a3a;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="mfa-card">
        <h3 class="mb-4" style="color: #5d3a3a;">MFA Verification</h3>
        <p class="small text-muted mb-4">Enter the 6-digit code from your Authenticator app.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} p-2 small">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="/verify_mfa" method="POST">
            <input type="hidden" name="username" value="{{ username }}">
            
            <div class="mb-4">
                <input type="text" name="otp_code" class="form-control text-center form-control-lg" 
                       placeholder="000000" maxlength="6" pattern="\d{6}" required>
            </div>

            <button type="submit" class="btn btn-mfa w-100 py-2">Verify & Access Portal</button>
        </form>
    </div>
</div>

</body>
</html>
